  <!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100">
    
<div class="auth-container container">
    <div class="signup-card mx-auto" id="signup-card">
        <div class="auth-card p-4 rounded shadow-lg">
            <h3 class="text-center text-white mb-4">Create Account</h3>

            <form id="signup-form">
                <div class="form-group w-100">
                    <label for="name" class="form-label text-white">Name:</label>
                    <input type="text" id="name" class="form-control custom-input" placeholder="Enter your name"
                    >
                    <span class="error-message" id="nameError"></span>
                </div>

                <div class="form-group w-100">
                    <label for="email" class="form-label text-white">Email:</label>
                    <input type="email" id="email" class="form-control custom-input" placeholder="Enter your email">
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group w-100">
                    <label for="password" class="form-label text-white">Password:</label>
                    <input type="password" id="password" class="form-control custom-input" placeholder="Enter password">
                    <span class="error-password" id="passwordError"></span>
                </div>

                <div class="form-group w-100">
                    <label for="confirm-password" class="form-label text-white">Confirm Password:</label>
                    <input type="password" id="confirmPassword" class="form-control custom-input"
                        placeholder="Confirm password">
                    <span class="error-confirm-password" id="confirmPasswordError"></span>
                </div>

                <button type="submit" class="button w-100 mt-2">Signup</button>

                <div class="d-flex justify-content-center align-items-center gap-2 mt-3">
                     <p class="mb-0 text-white">Already have an account?</p>
                    <a href="#" id="show-login" class="text-decoration-none text-success">Login</a>
                </div>
            </form>
        </div>

    </div>

    <div class="login-card mx-auto" id="login-card">        
        <div class="auth-card p-4 rounded shadow-lg">
            <h3 class="text-center text-white mb-4">Login to Your Account</h3>

            <form id="login-form">
                <div class="form-group w-100">
                    <label for="email" class="form-label text-white">Email:</label>
                    <input type="email" id="loginEmail" class="form-control custom-input" placeholder="Enter your email"
                        required>
                    <span class="error-message" id="loginEmailError"></span>
                </div>

                <div class="form-group w-100">
                    <label for="password" class="form-label text-white">Password:</label>
                    <input type="password" id="loginPassword" class="form-control custom-input" placeholder="Enter password"
                        required>
                    <span class="error-message" id="loginPasswordError"></span>
                </div>

                <button type="submit" class="button w-100 mt-2">Login</button>
                <span class="error-message" id="loginError"></span>

                <div class="d-flex justify-content-center align-items-center gap-2 mt-3">
                     <p class="mb-0 text-white">Don't have an account?</p>
                    <a href="#" id="show-signup" class="text-decoration-none text-success">Signup</a>
                </div>
            </form>
        </div>
        
    </div>


</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="auth.js"></script>
</body>
</html>
